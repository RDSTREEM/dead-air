[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dead-air"
version = "0.1.0"
description = "A cosmic horror radio investigation game"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
]

[project.scripts]
dead-air = "dead_air.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dead_air = ["data/**/*.json"]